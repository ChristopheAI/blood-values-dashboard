name: Developer Slice
description: Track one buildable product or engineering slice for Codex.
title: "[Slice]: "
labels:
  - codex
body:
  - type: markdown
    attributes:
      value: |
        Use one issue per active slice. Do not include private lab PDFs, real biomarker values, symptoms, medication notes, consult exports, or account data.
  - type: input
    id: product_goal
    attributes:
      label: Product goal
      description: One sentence describing what user outcome this slice unlocks.
      placeholder: "As the owner, I can..."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope for this slice?
      placeholder: |
        - ...
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Name adjacent work that Codex must not drift into.
      placeholder: |
        - Runtime AI/OCR/external processing
        - Medical advice or diagnosis copy
    validations:
      required: true
  - type: textarea
    id: source_of_truth
    attributes:
      label: Source of truth
      description: Link every upstream artifact this slice derives from. Use repo-relative paths, issue numbers, PRD/spec/ADR sections, UX/design refs, or data-model refs. If a needed source is missing, mark it as a gap.
      placeholder: |
        - Product sentence: docs/codex-prd.md#...
        - Spec/ADR: docs/v1-spec.md#..., docs/adr/00xx-...
        - Related issue: #...
        - [NEEDS-DESIGN] ...
        - [NEEDS-DECISION] ...
    validations:
      required: true
  - type: textarea
    id: task_contract
    attributes:
      label: Source-linked task contract
      description: Break the work into small tasks. Each user-facing/domain task should cite its source. Infra-only tasks may be self-contained.
      placeholder: |
        - [ ] Add domain builder for ... (ref: docs/codex-prd.md#...)
        - [ ] Add feature test for ... (ref: #...)
        - [ ] [NEEDS-DESIGN] ...
    validations:
      required: true
  - type: textarea
    id: likely_files
    attributes:
      label: Likely files or areas
      description: Point Codex at the most relevant directories/files and AGENTS nodes.
      placeholder: |
        - app/Domain/...
        - app/Livewire/...
        - resources/views/...
        - tests/Feature/...
    validations:
      required: true
  - type: checkboxes
    id: hard_boundaries
    attributes:
      label: Hard boundaries
      options:
        - label: Confirmed-only downstream remains enforced.
          required: true
        - label: Owner scoping is enforced server-side.
          required: true
        - label: No private data goes to AI, Exa, Firecrawl, OCR, logs, screenshots, or external services.
          required: true
        - label: No medical claims, diagnosis, treatment, urgency, health scoring, or recommendation copy.
          required: true
        - label: Source references are resolvable, or gaps are explicitly marked as [NEEDS-DESIGN] / [NEEDS-DECISION].
          required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes, including edge cases.
      placeholder: |
        - Given...
        - When...
        - Then...
    validations:
      required: true
  - type: textarea
    id: manual_qa_gate
    attributes:
      label: Manual QA gate
      description: Name the real app surface Codex must drive before claiming done.
      placeholder: |
        - Matching surface: browser / route / export / console command / GitHub issue form
        - Route or command:
        - Account/data scenario:
        - Observable proof:
        - Must not appear/leak:
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation commands and browser QA
      description: Exact commands plus real routes/screens to inspect.
      placeholder: |
        - php artisan test ...
        - sh scripts/validate.sh
        - Browser QA: /dashboard, /blood-tests/{id}
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff notes
      description: Branch, baseline commit, existing uncommitted files, and known risks.
      placeholder: |
        Branch:
        Baseline commit:
        Do not touch:
        Known risks:
